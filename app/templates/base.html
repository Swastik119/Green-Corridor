<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Green Corridor AI Platform - Emergency Organ Transportation Portal{% endblock %}</title>

  <!-- Government Portal Design Stylesheet -->
  <link rel="stylesheet" href="/static/css/govt-portal.css">
  <!-- UI Refinements (typography, table widths, Lucide, single-row nav) -->
  <link rel="stylesheet" href="/static/css/govt-portal-refinements.css">

  <!-- Leaflet Maps CSS (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Lucide Icons (professional SVG icon set) -->
  <script src="https://unpkg.com/lucide@0.408.0/dist/umd/lucide.js"></script>

  {% block extra_head %}{% endblock %}
</head>
<body id="top">

  <!-- Header Component -->
  {% include 'components/header.html' %}

  <!-- Main Content Body -->
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer Component -->
  {% include 'components/footer.html' %}

  <!-- Global Shared State & Utilities Scripts -->
  <script src="/static/js/mission-data.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/tracking.js"></script>
  <script src="/static/js/ai-dashboard.js"></script>

  {% block scripts %}{% endblock %}

  <!-- Activate Lucide icons - must run after all page content is inserted -->
  <script>
    if (typeof lucide !== 'undefined') { lucide.createIcons(); }
  </script>
</body>
</html>
